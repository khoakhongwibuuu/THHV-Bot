services:
  bot:
    build: .
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./logs:/usr/src/bot/logs
      - ./configs:/usr/src/bot/configs
    restart: unless-stopped
    environment:
      - TOKEN=${TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - OWNER_ID=${OWNER_ID}
      - DATABASE_URL=postgresql://root:secret_password@postgres:5432/thhv_bot_db?schema=public
      - REDIS_URL=redis://redis:6379
    networks:
      - multi-domain

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: thhv_bot_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - multi-domain

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - multi-domain

volumes:
  postgres_data:
  redis_data:

networks:
  multi-domain:
    external: true
    name: multi-domain
