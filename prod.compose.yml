services:
  bot:
    build: .
    depends_on:
      - thhv_postgres
      - thhv_redis
    restart: unless-stopped
    environment:
      - TOKEN=${TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - OWNER_ID=${OWNER_ID}
      - ONLINE_STATUS=${ONLINE_STATUS}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@thhv_postgres:5432/${POSTGRES_DB}?schema=public
      - REDIS_URL=redis://thhv_redis:6379
    networks:
      - multi-domain

  thhv_postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - multi-domain

  thhv_redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    volumes:
      - redis_data:/data
    networks:
      - multi-domain

volumes:
  postgres_data:
  redis_data:

networks:
  multi-domain:
    external: true
    name: multi-domain
