services:
  chv-bot:
    build: .
    volumes:
      - ./logs:/usr/src/bot/logs
      - ./configs:/usr/src/bot/configs
      - ./modules:/usr/src/bot/modules

    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s    
    environment:
      - TOKEN=
      - CLIENT_ID=
      - OWNER_ID=